services:
  app:
    image: ghcr.io/loice5/reah:latest
    container_name: reah-app
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgresql://reah_user:reah_password@db:5432/reah_db
      SESSION_SECRET: reah-local-compose-session-secret
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./volumes/app:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - app

  db:
    image: postgres:18-alpine
    container_name: reah-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: reah_user
      POSTGRES_PASSWORD: reah_password
      POSTGRES_DB: reah_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./volumes/postgres:/var/lib/postgresql
    healthcheck:
      test: pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  uploads:
